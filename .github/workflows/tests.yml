name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:        # lets release.yml require this before publishing

permissions:
  contents: read    # the suite only needs to check the repo out

jobs:
  test:
    name: Lua test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lupa
        run: python -m pip install --upgrade pip lupa

      - name: Run the Lua test suite
        run: python tests/run_tests.py
