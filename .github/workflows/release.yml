name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Gate publishing on the test suite so a tag can never ship a broken build.
  # Drop this job and the `needs:` line below to publish without testing.
  test:
    uses: ./.github/workflows/tests.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # The packager creates (or updates) a GitHub Release for the tag and
      # uploads the zip as a release asset, so the automatic GITHUB_TOKEN needs
      # write access to repository contents. Declared explicitly because repos
      # default workflow tokens to read-only.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and all tags. The packager derives the version from
          # `git describe --tags`, finds the previous tag via `HEAD~`, and builds
          # the changelog from `git log <previous tag>..<tag>`. On the default
          # shallow clone HEAD~ does not exist, so there is no previous tag, the
          # changelog collapses to the single tagged commit, and the revision
          # count from `git rev-list --count` is 1 instead of the real total.
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # Enables the GitHub Release, which also restores the "Previous
          # Releases" link in the generated changelog. GITHUB_TOKEN is provided
          # by Actions automatically - there is no secret to configure.
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
