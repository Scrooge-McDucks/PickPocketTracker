name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Gate publishing on the test suite so a tag can never ship a broken build.
  # Drop this job and the `needs:` line below to publish without testing.
  test:
    uses: ./.github/workflows/tests.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
